name: "微信 - 查找『傻狗』并进入聊天"
platform: "android"

config:
  work_size: [612, 1344]      # 荣耀 Magic5 等 1080P 机型缩半，OCR 提速明显
  auto_screenshot: true       # 失败自动截图存证
  continue_on_failure: false  # 找不到联系人即中止，避免误点

steps:
  # 0. 前置：微信已在前台 / 后台，先等待渲染
  - action: "wait"
    seconds: 2
    desc: "等待微信主界面渲染完成"

  # 1. 兜底：若当前停在"通讯录"以外的 tab，先切到聊天列表（可选）
  #    若你的微信默认已在"微信"tab，可删掉这一步
  - action: "find_text"
    target: "微信"
    save_as: "wx_tab"
    desc: "定位底部『微信』tab（聊天列表）"

  - action: "click"
    target: "wx_tab"
    desc: "切回聊天列表"
  - action: "wait"
    seconds: 1

  # 2. 在聊天列表里找联系人『傻狗』
  #    若傻狗不在最近会话首屏，需先扩展 swipe action 滚动，见文末说明
  - action: "find_text"
    target: "傻狗"
    save_as: "target_chat"
    desc: "在聊天列表定位『傻狗』"

  # 3. 点击进入聊天
  - action: "click"
    target: "target_chat"
    desc: "点击『傻狗』进入聊天窗口"
  - action: "wait"
    seconds: 2

  # 4. 断言：聊天页顶部标题栏应出现『傻狗』，且输入框提示"发送消息"
  #    用同一个文字识别做软断言；若你的 Runner 暂不支持 assert，这步可先注释
  - action: "find_text"
    target: "傻狗"
    save_as: "chat_title"
    desc: "校验聊天页标题为『傻狗』（进入成功）"